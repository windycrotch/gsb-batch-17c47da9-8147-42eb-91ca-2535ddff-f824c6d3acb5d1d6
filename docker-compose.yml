services:
  yt-dlp-restream:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: yt-dlp-restream
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
